services:
  postgres:
    image: postgres:16-alpine
    container_name: chat-postgres
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5440:5432" # host port for local tools; the api uses postgres:5432 inside the network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/CodingJamAPI
      dockerfile: Dockerfile
    container_name: chat-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=chatdb;Username=postgres;Password=postgres
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-docker-dev-signing-key-change-me-at-least-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5125:8080" # direct API access (the frontend proxies /api and /hubs here)
    volumes:
      - uploads-data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chat-frontend
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  postgres-data:
  uploads-data:
