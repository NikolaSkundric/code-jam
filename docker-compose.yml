services:
  postgres:
    image: postgres:16-alpine
    container_name: chat-postgres
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5440:5432" # local tools only (not reachable from the network); the api uses postgres:5432 inside the compose network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local inbox for outgoing mail (password reset links): http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: chat-mailpit
    ports:
      - "127.0.0.1:8025:8025" # web UI
    restart: unless-stopped

  api:
    build:
      context: ./backend/CodingJamAPI
      dockerfile: Dockerfile
    container_name: chat-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=chatdb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-} # empty: the API uses a random key per start
      Email__Host: mailpit
      Email__Port: "1025"
      Email__From: no-reply@chat.local
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "5125:8080" # direct API access (the frontend proxies /api and /hubs here)
    volumes:
      - uploads-data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chat-frontend
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  postgres-data:
  uploads-data:
