server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Up to 5 files of 20 MB per message (see TASK.md) plus multipart overhead; the API enforces the exact limits.
    client_max_body_size 110m;

    # Docker's DNS server; the API address is looked up again every few seconds, so the proxy keeps working
    # after the api container was recreated (a plain proxy_pass resolves the name only once at startup).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # REST API
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR hubs (WebSocket upgrade)
    location /hubs/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Hashed build assets never change: cache them for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app fallback. index.html must always be revalidated, otherwise a browser keeps
    # running an old bundle (e.g. one that does not send the X-Requested-With header the API needs).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
